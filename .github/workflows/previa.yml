name: Prévia no GitHub Pages

on:
  push:
    branches: [preview]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: previa-pages
  cancel-in-progress: false

jobs:
  preparar:
    if: github.event.repository.private == false && github.ref == 'refs/heads/preview'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar a base colaborativa
        run: python3 -m unittest discover -s tests -v
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: preview

  publicar:
    needs: preparar
    if: github.event.repository.private == false && github.ref == 'refs/heads/preview'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - name: Publicar a prévia
        id: publicacao
        uses: actions/deploy-pages@v4
