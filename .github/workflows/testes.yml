name: Testes

on:
  push:
  pull_request:
    branches: [main, preview]

permissions:
  contents: read

jobs:
  testes:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar a base colaborativa
        run: python3 -m unittest discover -s tests -v
      - name: Validar JavaScript e montagem da central
        run: |
          node --check preview/painel.js
          python3 scripts/montar_painel.py "$RUNNER_TEMP/central" --commit "$GITHUB_SHA"
