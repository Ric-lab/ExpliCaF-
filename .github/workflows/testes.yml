name: Testes

on:
  push:
  pull_request:
    branches: [main, preview]

permissions:
  contents: read

jobs:
  testes:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar a base colaborativa
        run: python3 -m unittest discover -s tests -v
